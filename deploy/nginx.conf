server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Railway terminates TLS in front of us; trust its forwarded headers.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Long cache for the vendored zip reader and icons: they change rarely and
    # are content-addressed by filename in practice.
    location ~* \.(?:js|css|png|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
